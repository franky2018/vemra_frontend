name: CI

on:
  push:
    branches: [main, stagging]
  pull_request:
    branches: [main, stagging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_BASE_URL: https://vemra-backend.onrender.com
  NEXT_PUBLIC_API_PREFIX: /api/v1
  NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy-project.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
  NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_ci_dummy
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
  NEXT_PUBLIC_SENTRY_DSN: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Verify ENDPOINTS still match the live spec
        continue-on-error: true
        run: |
          npm run fetch:api
          git diff --stat -- docs/openapi.json
          npm run test -- src/lib/api/endpoints.spec.ts

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Audit
        run: npm run audit:gate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
